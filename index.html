<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drayage Games Hub</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080816;color:#ccc;font-family:'Courier New',monospace;min-height:100vh;padding:0 0 60px}

    header{text-align:center;padding:48px 16px 32px;border-bottom:1px solid #0f0f28;position:relative;overflow:hidden}
    header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,#0d1a4a 0%,transparent 70%);pointer-events:none}
    header h1{font-size:clamp(22px,6vw,46px);color:#7799ff;text-shadow:0 0 24px #3355cc,0 0 60px #1133aa44;letter-spacing:6px;margin-bottom:8px;position:relative}
    header h1 span{color:#aabbff}
    header .sub{font-size:11px;color:#334466;letter-spacing:3px;position:relative}
    .stats-row{display:flex;justify-content:center;flex-wrap:wrap;gap:20px 32px;margin-top:20px;font-size:10px;color:#3a4a6a;letter-spacing:2px;position:relative}
    .stats-row b{color:#5577aa}

    .filter-bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:20px 16px;max-width:900px;margin:0 auto}
    .filter-btn{background:#0d0d22;border:1px solid #1a1a3a;color:#445;font-family:monospace;font-size:10px;padding:5px 14px;border-radius:3px;cursor:pointer;letter-spacing:1px;transition:all .15s}
    .filter-btn:hover,.filter-btn.active{border-color:#3355aa;color:#7799ee;background:#111130}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1100px;margin:0 auto;padding:0 16px}

    .card{display:block;background:#0c0c20;border:1px solid #181830;border-radius:10px;padding:18px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
    .card:hover{transform:translateY(-3px);border-color:#2a3a7a;box-shadow:0 8px 28px rgba(22,44,140,.35)}
    .card.hidden{display:none}

    .card-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
    .icon{width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:#090920;border:1px solid #151535;border-radius:10px;flex-shrink:0;overflow:hidden;font-size:30px;transition:border-color .15s}
    .icon img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;animation:iconFade .3s ease}
    @keyframes iconFade{from{opacity:0}to{opacity:1}}
    .card:hover .icon{border-color:#2244aa}

    .name-block{flex:1;min-width:0}
    .name-ko{font-size:14px;font-weight:bold;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .name-en{font-size:10px;color:#445;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
    .repo{font-size:9px;color:#222a40;letter-spacing:1px}

    .desc{font-size:11px;color:#556;line-height:1.65;margin-bottom:10px;min-height:36px}

    .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
    .tag{font-size:9px;padding:2px 8px;border-radius:3px;letter-spacing:.5px}
    .tag-genre{background:#0e0e28;color:#4455aa;border:1px solid #1a1a3a}
    .tag-single{background:#0e1e0e;color:#336633;border:1px solid #1a2e1a}
    .tag-online{background:#0e1828;color:#334466;border:1px solid #1a2a3a}
    .tag-online-only{background:#1a0e28;color:#554488;border:1px solid #2a1a3a}

    .completion-row{display:flex;align-items:center;gap:10px}
    .bar-bg{flex:1;height:4px;background:#0a0a20;border-radius:2px;overflow:hidden}
    .bar-fill{height:100%;border-radius:2px}
    .pct{font-size:10px;width:30px;text-align:right;flex-shrink:0}
    .badge{font-size:9px;padding:2px 8px;border-radius:3px;letter-spacing:1px;flex-shrink:0}

    .s-done .name-ko{color:#6abf8a} .s-done .bar-fill{background:linear-gradient(90deg,#1a5e38,#4caf80)} .s-done .pct{color:#4caf80} .s-done .badge{background:#0a2018;color:#4caf80;border:1px solid #1a4028}
    .s-beta .name-ko{color:#6699dd} .s-beta .bar-fill{background:linear-gradient(90deg,#1a3a7a,#5580cc)} .s-beta .pct{color:#5580cc} .s-beta .badge{background:#0a1430;color:#5580cc;border:1px solid #1a2850}
    .s-wip  .name-ko{color:#cc8844} .s-wip  .bar-fill{background:linear-gradient(90deg,#5a3010,#e08030)} .s-wip  .pct{color:#e08030} .s-wip  .badge{background:#200e00;color:#e08030;border:1px solid #3a2010}
    .s-stop .name-ko{color:#6655aa} .s-stop .bar-fill{background:linear-gradient(90deg,#1e1535,#6655aa)} .s-stop .pct{color:#6655aa} .s-stop .badge{background:#100e20;color:#6655aa;border:1px solid #2a2040} .s-stop .desc{color:#3a3a52} .s-stop .bar-bg{opacity:.6}

    .edit-btn{position:absolute;top:10px;right:10px;background:#0d0d22;border:1px solid #1a1a3a;color:#334;font-size:9px;padding:2px 7px;border-radius:3px;cursor:pointer;text-decoration:none;opacity:0;transition:opacity .15s;letter-spacing:1px}
    .card:hover .edit-btn{opacity:1}

    footer{text-align:center;margin-top:48px;font-size:9px;color:#1a1a30;letter-spacing:2px}

    #error-msg{text-align:center;padding:40px;color:#553;font-size:12px}

    @media(max-width:520px){.grid{grid-template-columns:1fr}.filter-bar{gap:6px}}
  </style>
</head>
<body>
<header>
  <h1>★ <span>DRAYAGE</span> GAMES ★</h1>
  <p class="sub">GITHUB PAGES COLLECTION</p>
  <div class="stats-row">
    <span><b id="s-total">0</b> GAMES</span>
    <span><b id="s-done">0</b> DONE</span>
    <span><b id="s-beta">0</b> BETA</span>
    <span><b id="s-wip">0</b> WIP</span>
    <span><b id="s-stop">0</b> STOP</span>
  </div>
</header>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">ALL</button>
  <button class="filter-btn" data-filter="done">DONE</button>
  <button class="filter-btn" data-filter="beta">BETA</button>
  <button class="filter-btn" data-filter="wip">WIP</button>
  <button class="filter-btn" data-filter="stop">STOP</button>
</div>

<div class="grid" id="grid">
  <div id="error-msg" style="display:none">games.json 로드 실패</div>
</div>

<footer>
  <p>© 2026 DRAYAGE &nbsp;·&nbsp; ALL GAMES BUILT WITH HTML / JS &nbsp;·&nbsp; GITHUB PAGES &nbsp;·&nbsp; <a href="editor.html" style="color:#2a2a4a;text-decoration:none">EDITOR</a></p>
</footer>

<script>
const BADGE_LABELS = { done:'DONE', beta:'BETA', wip:'WIP', stop:'STOP' };

function playerTags(g) {
  const tags = [];
  if (g.onlineOnly) {
    tags.push(`<span class="tag tag-online-only">온라인 전용 ${g.online}인</span>`);
  } else {
    if (g.single) tags.push('<span class="tag tag-single">싱글</span>');
    if (g.online > 0) tags.push(`<span class="tag tag-online">온라인 ${g.online}인</span>`);
  }
  return tags.join('');
}

function buildCard(g) {
  const a = document.createElement('a');
  a.className = `card s-${g.status}`;
  a.dataset.status = g.status;
  a.href = g.url;
  a.target = g.url.startsWith('http') ? '_blank' : '_self';

  a.innerHTML = `
    <div class="card-top">
      <div class="icon" data-emoji="${g.emoji}">${g.emoji}</div>
      <div class="name-block">
        <div class="name-ko">${g.nameKo}</div>
        <div class="name-en">${g.nameEn}</div>
        <div class="repo">${g.repo}</div>
      </div>
    </div>
    <p class="desc">${g.desc}</p>
    <div class="tags">
      <span class="tag tag-genre">${g.genre}</span>
      ${playerTags(g)}
    </div>
    <div class="completion-row">
      <div class="bar-bg"><div class="bar-fill" style="width:${g.completion}%"></div></div>
      <span class="pct">${g.completion}%</span>
      <span class="badge">${BADGE_LABELS[g.status] || g.status.toUpperCase()}</span>
    </div>`;
  return a;
}

async function loadIcon(card, g) {
  const iconEl = card.querySelector('.icon');
  try {
    const url = new URL(g.url, location.href);
    const base = url.origin + url.pathname.replace(/\/[^\/]*$/, '');
    const res = await fetch(base + '/manifest.json');
    if (!res.ok) return;
    const manifest = await res.json();
    // purpose가 "maskable"만 있는 건 제외, "any maskable" / "any" / 없음은 허용
    const icons = (manifest.icons || [])
      .filter(i => i.src && (i.purpose || 'any').toLowerCase().includes('any'))
      .sort((a, b) => {
        const sa = parseInt((a.sizes||'0x0').split('x')[0]) || 0;
        const sb = parseInt((b.sizes||'0x0').split('x')[0]) || 0;
        return sb - sa;
      });
    // any 없으면 purpose 상관없이 그냥 제일 큰 거
    const fallback = (manifest.icons || [])
      .sort((a,b) => (parseInt((b.sizes||'0x0').split('x')[0])||0) - (parseInt((a.sizes||'0x0').split('x')[0])||0));
    const picked = (icons.length ? icons : fallback)[0];
    if (!picked) return;
    let src = picked.src;
    if (!src.startsWith('http')) src = src.startsWith('/') ? url.origin + src : base + '/' + src.replace(/^\.\//, '');
    const img = new Image();
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;';
    img.onload = () => { iconEl.innerHTML = ''; iconEl.appendChild(img); };
    img.src = src;
  } catch(e) {}
}

async function init() {
  const grid = document.getElementById('grid');
  let games;
  try {
    const res = await fetch('games.json');
    if (!res.ok) throw new Error();
    games = await res.json();
  } catch(e) {
    document.getElementById('error-msg').style.display = 'block';
    return;
  }

  games.forEach(g => {
    const card = buildCard(g);
    grid.appendChild(card);
    loadIcon(card, g);
  });

  // 통계
  const count = s => games.filter(g => g.status === s).length;
  document.getElementById('s-total').textContent = games.length;
  document.getElementById('s-done').textContent  = count('done');
  document.getElementById('s-beta').textContent  = count('beta');
  document.getElementById('s-wip').textContent   = count('wip');
  document.getElementById('s-stop').textContent  = count('stop');

  // 필터
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      document.querySelectorAll('.card').forEach(c => {
        c.classList.toggle('hidden', f !== 'all' && c.dataset.status !== f);
      });
    });
  });
}

init();
</script>
</body>
</html>
